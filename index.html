<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team Pulse</title>
<style>
  :root {
    color-scheme: light;
    --page:        #f9f9f7;
    --surface:     #fcfcfb;
    --text:        #0b0b0b;
    --text-2:      #52514e;
    --muted:       #898781;
    --gridline:    #e1e0d9;
    --baseline:    #c3c2b7;
    --border:      rgba(11,11,11,0.10);
    --series-1:    #2a78d6;
    --good:        #0ca30c;
    --warning:     #fab219;
    --serious:     #ec835a;
    --critical:    #d03b3b;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page:        #0d0d0d;
      --surface:     #1a1a19;
      --text:        #ffffff;
      --text-2:      #c3c2b7;
      --muted:       #898781;
      --gridline:    #2c2c2a;
      --baseline:    #383835;
      --border:      rgba(255,255,255,0.10);
      --series-1:    #3987e5;
      --good:        #0ca30c;
      --warning:     #fab219;
      --serious:     #ec835a;
      --critical:    #e66767;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page:        #0d0d0d;
    --surface:     #1a1a19;
    --text:        #ffffff;
    --text-2:      #c3c2b7;
    --muted:       #898781;
    --gridline:    #2c2c2a;
    --baseline:    #383835;
    --border:      rgba(255,255,255,0.10);
    --series-1:    #3987e5;
    --good:        #0ca30c;
    --warning:     #fab219;
    --serious:     #ec835a;
    --critical:    #e66767;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 1080px; margin: 0 auto; padding: 32px 24px 64px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .subtitle { color: var(--text-2); margin: 0 0 32px; }
  h2 { font-size: 15px; text-transform: uppercase; letter-spacing: 0.04em;
       color: var(--text-2); margin: 40px 0 16px; }

  #status {
    padding: 12px 16px; border-radius: 8px; background: var(--surface);
    border: 1px solid var(--border); color: var(--text-2);
  }
  #status[hidden] { display: none; }
  #status.error { color: var(--critical); }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 16px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
  }

  .member-card .name { font-weight: 600; margin: 0 0 2px; }
  .member-card .project { color: var(--muted); font-size: 13px; margin: 0 0 12px; }
  .mood-badge {
    display: inline-flex; align-items: center; gap: 6px;
    font-weight: 600; font-size: 14px; margin-bottom: 8px;
  }
  .mood-badge .icon { font-size: 13px; line-height: 1; }
  .mood-badge .value { font-variant-numeric: tabular-nums; color: var(--text-2); font-weight: 400; }
  .member-card .note { color: var(--text-2); font-size: 13px; margin: 0; }
  .member-card .week { color: var(--muted); font-size: 12px; margin: 8px 0 0; }
  .member-card .empty { color: var(--muted); font-size: 13px; font-style: italic; }

  .project-card .name { font-weight: 600; margin: 0 0 4px; }
  .project-card .latest { color: var(--text-2); font-size: 13px; margin: 0 0 8px; }
  .project-card svg { display: block; width: 100%; height: auto; overflow: visible; }
  .project-card .empty { color: var(--muted); font-size: 13px; font-style: italic; }

  .chart-line { fill: none; stroke: var(--series-1); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .chart-point { fill: var(--series-1); }
  .chart-grid { stroke: var(--gridline); stroke-width: 1; }
  .chart-baseline { stroke: var(--baseline); stroke-width: 1.5; }
  .chart-axis-label { fill: var(--muted); font-size: 9px; }
  .chart-value-label { fill: var(--text-2); font-size: 10px; font-weight: 600; }
</style>
</head>
<body>
<main>
  <h1>Team Pulse</h1>
  <p class="subtitle">A card per member's latest check-in, and each project's weekly mood trend.</p>

  <div id="status" role="status" aria-live="polite" hidden></div>

  <h2>Team</h2>
  <div id="member-grid" class="grid"></div>

  <h2>Weekly trend</h2>
  <div id="project-grid" class="grid"></div>
</main>

<script>
(function () {
  "use strict";

  function setStatus(text, isError) {
    var el = document.getElementById("status");
    if (!text) { el.hidden = true; return; }
    el.hidden = false;
    el.textContent = text;
    el.className = isError ? "error" : "";
  }

  function fetchPulse(params) {
    var qs = new URLSearchParams(params || {}).toString();
    var url = "/api/pulse" + (qs ? "?" + qs : "");
    return fetch(url).then(function (res) {
      if (!res.ok) throw new Error(url + " -> " + res.status);
      return res.json();
    });
  }

  // Mood is a 1-5 health signal, so it borrows the status palette (never
  // color alone: each band also carries a distinct icon shape and word).
  function moodMeta(mood) {
    if (mood >= 4) return { cls: "good", icon: "▲", label: "Good" };
    if (mood === 3) return { cls: "warning", icon: "●", label: "Okay" };
    if (mood === 2) return { cls: "serious", icon: "▼", label: "Low" };
    return { cls: "critical", icon: "▼▼", label: "Struggling" };
  }

  function el(tag, className, text) {
    var e = document.createElement(tag);
    if (className) e.className = className;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  function renderMemberCard(member, checkin) {
    var card = el("div", "card member-card");
    card.appendChild(el("p", "name", member.name));

    if (!checkin) {
      card.appendChild(el("p", "empty", "No check-in this week"));
      return card;
    }

    var meta = moodMeta(checkin.mood);
    card.appendChild(el("p", "project", checkin.projectName));

    var badge = el("div", "mood-badge");
    var icon = el("span", "icon", meta.icon);
    icon.style.color = "var(--" + meta.cls + ")";
    badge.appendChild(icon);
    badge.appendChild(document.createTextNode(meta.label));
    badge.appendChild(el("span", "value", "(" + checkin.mood + "/5)"));
    card.appendChild(badge);

    if (checkin.note) card.appendChild(el("p", "note", "“" + checkin.note + "”"));
    card.appendChild(el("p", "week", checkin.week));
    return card;
  }

  function weekShort(week) {
    var m = /W(\d+)$/.exec(week || "");
    return m ? "W" + m[1] : week;
  }

  function trendSVG(trend) {
    var w = 320, h = 150, padL = 22, padR = 12, padT = 14, padB = 20;
    var plotW = w - padL - padR, plotH = h - padT - padB;
    var n = trend.length;

    function x(i) { return n <= 1 ? padL + plotW / 2 : padL + (plotW * i) / (n - 1); }
    function y(mood) { return padT + plotH * (5 - mood) / 4; }

    var svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("viewBox", "0 0 " + w + " " + h);

    [1, 3, 5].forEach(function (m) {
      var gy = y(m);
      var line = document.createElementNS(svg.namespaceURI, "line");
      line.setAttribute("class", m === 1 ? "chart-baseline" : "chart-grid");
      line.setAttribute("x1", padL); line.setAttribute("x2", w - padR);
      line.setAttribute("y1", gy); line.setAttribute("y2", gy);
      svg.appendChild(line);

      var label = document.createElementNS(svg.namespaceURI, "text");
      label.setAttribute("class", "chart-axis-label");
      label.setAttribute("x", 2); label.setAttribute("y", gy + 3);
      label.textContent = m;
      svg.appendChild(label);
    });

    var tickIdx = n <= 1 ? [0] : n === 2 ? [0, 1] : [0, Math.floor((n - 1) / 2), n - 1];
    tickIdx.forEach(function (i) {
      var label = document.createElementNS(svg.namespaceURI, "text");
      label.setAttribute("class", "chart-axis-label");
      label.setAttribute("x", x(i));
      label.setAttribute("y", h - 4);
      label.setAttribute("text-anchor", i === 0 ? "start" : i === n - 1 ? "end" : "middle");
      label.textContent = weekShort(trend[i].week);
      svg.appendChild(label);
    });

    if (n > 1) {
      var d = trend.map(function (pt, i) {
        return (i === 0 ? "M" : "L") + x(i) + " " + y(pt.averageMood);
      }).join(" ");
      var path = document.createElementNS(svg.namespaceURI, "path");
      path.setAttribute("class", "chart-line");
      path.setAttribute("d", d);
      svg.appendChild(path);
    }

    trend.forEach(function (pt, i) {
      var c = document.createElementNS(svg.namespaceURI, "circle");
      c.setAttribute("class", "chart-point");
      c.setAttribute("cx", x(i)); c.setAttribute("cy", y(pt.averageMood)); c.setAttribute("r", 4);
      var title = document.createElementNS(svg.namespaceURI, "title");
      title.textContent = pt.week + ": avg mood " + pt.averageMood.toFixed(1) + " (" + pt.count + " check-in" + (pt.count === 1 ? "" : "s") + ")";
      c.appendChild(title);
      svg.appendChild(c);

      if (i === n - 1) {
        var vl = document.createElementNS(svg.namespaceURI, "text");
        vl.setAttribute("class", "chart-value-label");
        vl.setAttribute("x", x(i));
        vl.setAttribute("y", y(pt.averageMood) - 8);
        vl.setAttribute("text-anchor", "end");
        vl.textContent = pt.averageMood.toFixed(1);
        svg.appendChild(vl);
      }
    });

    return svg;
  }

  function renderProjectCard(project, trend) {
    var card = el("div", "card project-card");
    card.appendChild(el("p", "name", project.name));

    if (!trend || !trend.length) {
      card.appendChild(el("p", "empty", "No check-ins yet"));
      return card;
    }

    var last = trend[trend.length - 1];
    card.appendChild(el("p", "latest", last.week + " · avg " + last.averageMood.toFixed(1) + "/5 · " + last.count + " check-in" + (last.count === 1 ? "" : "s")));
    card.appendChild(trendSVG(trend));
    return card;
  }

  // Weekly mood trend for one project: group its check-ins by week and
  // average the mood, sorted oldest to newest (ISO week strings sort
  // correctly as plain text).
  function computeTrend(checkins) {
    var byWeek = new Map();
    checkins.forEach(function (c) {
      if (!byWeek.has(c.week)) byWeek.set(c.week, []);
      byWeek.get(c.week).push(c.mood);
    });
    return Array.from(byWeek.keys()).sort().map(function (week) {
      var moods = byWeek.get(week);
      var sum = moods.reduce(function (a, b) { return a + b; }, 0);
      return {
        week: week,
        averageMood: Math.round((sum / moods.length) * 100) / 100,
        count: moods.length,
      };
    });
  }

  // The most recent week seen across every check-in, regardless of project.
  function latestWeekOf(checkins) {
    var latest = null;
    checkins.forEach(function (c) {
      if (!latest || c.week > latest) latest = c.week;
    });
    return latest;
  }

  // One check-in per member for the latest week. A member can have more
  // than one project's check-in that week (e.g. Sam: Pulse and Atlas in the
  // same week) — the API's response order isn't part of the contract, so
  // picking "the last one seen" would be unstable. Break the tie by project
  // id, ascending, so the same input always yields the same card.
  function computeLatestByMember(checkins, projects) {
    var projectName = {};
    projects.forEach(function (p) { projectName[p.id] = p.name; });

    var sorted = checkins.slice().sort(function (a, b) {
      return a.project < b.project ? -1 : a.project > b.project ? 1 : 0;
    });

    var latest = {};
    sorted.forEach(function (c) {
      latest[c.member] = {
        mood: c.mood,
        note: c.note,
        week: c.week,
        projectName: projectName[c.project] || c.project,
      };
    });
    return latest;
  }

  function main() {
    setStatus("Loading…");

    // No filters: the full members/projects lists plus every check-in, used
    // to find the latest week (contract: "No params returns every check-in").
    fetchPulse({}).then(function (base) {
      var members = base.members || [];
      var projects = base.projects || [];
      var latestWeek = latestWeekOf(base.checkins || []);

      var memberGrid = document.getElementById("member-grid");
      var trendGrid = document.getElementById("project-grid");
      memberGrid.innerHTML = "";
      trendGrid.innerHTML = "";

      var errors = [];

      // Per project, no week: that project's check-ins across every week,
      // for its weekly trend.
      var trendCalls = projects.map(function (p) {
        return fetchPulse({ project: p.id })
          .then(function (res) { return { project: p, trend: computeTrend(res.checkins || []) }; })
          .catch(function () { errors.push(p.name); return { project: p, trend: [] }; });
      });

      // No project, the latest week: that week's check-ins across every
      // project, for the member cards.
      var memberCall = latestWeek
        ? fetchPulse({ week: latestWeek }).then(function (res) { return res.checkins || []; }).catch(function () { errors.push("latest week"); return []; })
        : Promise.resolve([]);

      return Promise.all([Promise.all(trendCalls), memberCall]).then(function (results) {
        var trendResults = results[0];
        var latestCheckins = results[1];

        trendResults.forEach(function (r) { trendGrid.appendChild(renderProjectCard(r.project, r.trend)); });
        if (!projects.length) trendGrid.appendChild(el("p", "empty", "No projects yet"));

        var latestByMember = computeLatestByMember(latestCheckins, projects);
        members.forEach(function (m) { memberGrid.appendChild(renderMemberCard(m, latestByMember[m.id])); });
        if (!members.length) memberGrid.appendChild(el("p", "empty", "No members yet"));

        setStatus(errors.length ? "Couldn't load data for: " + errors.join(", ") : null, errors.length > 0);
      });
    }).catch(function (err) {
      setStatus("Could not load team data (" + err.message + "). Is the server running?", true);
    });
  }

  main();
})();
</script>
</body>
</html>
